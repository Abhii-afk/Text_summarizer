<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Summarize conversations with a T5 model served by FastAPI."
    >
    <title>T5 Summarizer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --card: rgba(15, 23, 42, 0.66);
        --card-border: rgba(148, 163, 184, 0.18);
        --text: #e8eefc;
        --muted: #93a1b8;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        --danger: #fda4af;
        --success: #34d399;
        --shadow: 0 24px 80px rgba(2, 6, 23, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 0%, rgba(139, 92, 246, 0.22), transparent 34rem),
          radial-gradient(circle at 88% 10%, rgba(34, 211, 238, 0.14), transparent 30rem),
          radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.1), transparent 36rem),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
      }

      .page {
        position: relative;
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: clamp(40px, 8vw, 88px) 0 32px;
      }

      .hero {
        max-width: 760px;
        margin-bottom: clamp(28px, 5vw, 44px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.45);
        color: #c4b5fd;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.65);
      }

      .hero h1 {
        margin: 20px 0 16px;
        font-size: clamp(2.5rem, 7vw, 4.8rem);
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .gradient {
        color: transparent;
        background: linear-gradient(100deg, #c4b5fd 0%, #8b5cf6 38%, #22d3ee 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      .lede {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.12rem);
        line-height: 1.7;
      }

      .card {
        padding: clamp(20px, 4vw, 34px);
        border: 1px solid var(--card-border);
        border-radius: 26px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }

      label {
        color: #cbd5e1;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .count {
        color: var(--muted);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 230px;
        padding: 18px;
        resize: vertical;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 16px;
        outline: none;
        background: rgba(2, 6, 23, 0.55);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        line-height: 1.65;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }

      textarea::placeholder {
        color: #64748b;
      }

      textarea:focus {
        border-color: rgba(139, 92, 246, 0.75);
        background: rgba(2, 6, 23, 0.72);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.16);
      }

      .hint {
        margin: 10px 0 0;
        color: #7f8da3;
        font-size: 0.8rem;
        line-height: 1.5;
      }

      kbd {
        padding: 2px 6px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-bottom-width: 2px;
        border-radius: 6px;
        background: rgba(148, 163, 184, 0.1);
        color: #cbd5e1;
        font: inherit;
        font-size: 0.75rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 0 18px;
        border: 1px solid transparent;
        border-radius: 13px;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          background 0.18s,
          border-color 0.18s,
          opacity 0.18s;
      }

      .btn:focus-visible,
      .copy:focus-visible {
        outline: 2px solid #c4b5fd;
        outline-offset: 3px;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
      }

      .primary {
        flex: 1 1 180px;
        background: linear-gradient(100deg, #a78bfa, #8b5cf6 45%, #22d3ee);
        color: #06101f;
        box-shadow: 0 10px 30px rgba(139, 92, 246, 0.24);
      }

      .primary:hover:not(:disabled) {
        box-shadow: 0 14px 36px rgba(34, 211, 238, 0.24);
      }

      .secondary {
        border-color: rgba(148, 163, 184, 0.2);
        background: rgba(148, 163, 184, 0.09);
        color: #dbe4f4;
      }

      .secondary:hover:not(:disabled) {
        background: rgba(148, 163, 184, 0.15);
      }

      .ghost {
        background: transparent;
        color: var(--muted);
      }

      .ghost:hover:not(:disabled) {
        background: rgba(148, 163, 184, 0.08);
        color: #e2e8f0;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(6, 16, 31, 0.25);
        border-top-color: #06101f;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      .is-loading .spinner {
        display: inline-block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        min-height: 1.25rem;
        margin: 14px 0 0;
        color: var(--danger);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .output {
        margin-top: 8px;
        padding-top: 24px;
        border-top: 1px solid rgba(148, 163, 184, 0.14);
      }

      .output-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .output h2 {
        margin: 0;
        color: #cbd5e1;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .copy {
        padding: 7px 12px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 9px;
        background: rgba(148, 163, 184, 0.08);
        color: #cbd5e1;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.18s, opacity 0.18s;
      }

      .copy:hover:not(:disabled) {
        background: rgba(148, 163, 184, 0.16);
      }

      .copy:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .summary {
        display: block;
        min-height: 72px;
        margin: 0;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.35);
        color: #e8eefc;
        font-size: 1rem;
        line-height: 1.72;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .summary.is-empty {
        color: #64748b;
        font-style: italic;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 4px 0;
        color: #6f7d92;
        font-size: 0.78rem;
      }

      .footer strong {
        color: #a5b4fc;
        font-weight: 700;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .status .dot {
        width: 6px;
        height: 6px;
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        .page {
          width: min(100% - 24px, 900px);
          padding-top: 32px;
        }

        .card {
          border-radius: 20px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="eyebrow"><span class="dot"></span> T5 &middot; FastAPI &middot; Docker</div>
        <h1>Long chats,<br><span class="gradient">short summaries.</span></h1>
        <p class="lede">
          Paste a conversation and let the model pull out what matters.
        </p>
      </header>

      <main class="card">
        <div class="field">
          <div class="field-head">
            <label for="text">Conversation</label>
            <span id="count" class="count">0 characters</span>
          </div>
          <textarea
            id="text"
            rows="10"
            placeholder="e.g. John: Are we meeting tomorrow?&#10;Sarah: Yes, at ten."
            spellcheck="true"
          ></textarea>
          <p class="hint">
            Tip: press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to summarize. Inputs are
            truncated to 512 tokens.
          </p>
        </div>

        <div class="actions">
          <button id="summarize" class="btn primary" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span id="summarize-label">Summarize</span>
          </button>
          <button id="example" class="btn secondary" type="button">
            Load example
          </button>
          <button id="clear" class="btn ghost" type="button">Clear</button>
        </div>

        <p id="error" class="error" role="alert" aria-live="polite"></p>

        <section class="output" aria-labelledby="summary-title">
          <div class="output-head">
            <h2 id="summary-title">Summary</h2>
            <button id="copy" class="copy" type="button" disabled>Copy</button>
          </div>
          <output id="summary" class="summary is-empty" aria-live="polite">Your summary will appear here.</output>
        </section>
      </main>

      <footer class="footer">
        <span>Powered by <strong>T5</strong> + <strong>FastAPI</strong></span>
        <span class="status"><span class="dot"></span> API ready</span>
      </footer>
    </div>

    <script>
      const text = document.getElementById("text");
      const summarizeButton = document.getElementById("summarize");
      const summarizeLabel = document.getElementById("summarize-label");
      const exampleButton = document.getElementById("example");
      const clearButton = document.getElementById("clear");
      const copyButton = document.getElementById("copy");
      const summary = document.getElementById("summary");
      const error = document.getElementById("error");
      const count = document.getElementById("count");

      const EXAMPLE = `John: Hey, are we still on for tomorrow?
Sarah: Yes, 10am at the usual cafe.
John: Could we do 11? I have a doctor's appointment.
Sarah: No problem. I'll move the calendar invite.
John: Thanks! See you then.`;

      let loading = false;

      function updateCount() {
        const length = text.value.length;
        count.textContent = `${length.toLocaleString()} character${
          length === 1 ? "" : "s"
        }`;
        clearButton.disabled = length === 0;
        summarizeButton.disabled = loading || !text.value.trim();
      }

      function setLoading(value) {
        loading = value;
        summarizeButton.classList.toggle("is-loading", value);
        summarizeButton.setAttribute("aria-busy", String(value));
        summarizeLabel.textContent = value ? "Summarizing..." : "Summarize";
        exampleButton.disabled = value;
        updateCount();
      }

      function setSummary(value) {
        const hasSummary = Boolean(value);
        summary.textContent = hasSummary
          ? value
          : "Your summary will appear here.";
        summary.classList.toggle("is-empty", !hasSummary);
        copyButton.disabled = !hasSummary;
      }

      async function summarize() {
        if (loading || !text.value.trim()) {
          return;
        }

        error.textContent = "";
        setSummary("");
        setLoading(true);

        try {
          const response = await fetch("/summarize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text.value }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.detail || "Unable to summarize this text.");
          }

          setSummary(data.summary || "No summary was returned.");
        } catch (requestError) {
          error.textContent =
            requestError.message || "Something went wrong. Please try again.";
        } finally {
          setLoading(false);
        }
      }

      text.addEventListener("input", () => {
        error.textContent = "";
        updateCount();
      });

      text.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          summarize();
        }
      });

      summarizeButton.addEventListener("click", summarize);

      exampleButton.addEventListener("click", () => {
        text.value = EXAMPLE;
        error.textContent = "";
        setSummary("");
        updateCount();
        text.focus();
      });

      clearButton.addEventListener("click", () => {
        text.value = "";
        error.textContent = "";
        setSummary("");
        updateCount();
        text.focus();
      });

      copyButton.addEventListener("click", async () => {
        if (copyButton.disabled) {
          return;
        }

        const value = summary.textContent;

        try {
          await navigator.clipboard.writeText(value);
        } catch {
          const helper = document.createElement("textarea");
          helper.value = value;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }

        copyButton.textContent = "Copied!";
        window.setTimeout(() => {
          copyButton.textContent = "Copy";
        }, 1500);
      });

      updateCount();
    </script>
  </body>
</html>
