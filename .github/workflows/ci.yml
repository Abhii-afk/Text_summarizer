name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t t5-summarizer .
      - run: |
          docker run -d --name t5-summarizer -p 8000:8000 t5-summarizer
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              break
            fi
            sleep 5
          done
          curl --fail -X POST http://localhost:8000/summarize \
            -H "Content-Type: application/json" \
            -d '{"text":"John: Are we meeting tomorrow? Sarah: Yes, at ten."}' \
            | grep -q '"summary"'
      - if: always()
        run: docker logs t5-summarizer
      - if: always()
        run: docker rm -f t5-summarizer

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
